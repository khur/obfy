<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>obfy og card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1c1c2e;
    --cream: #fffdf7;
    --pop1: #ff5e5b;
    --pop2: #ffed4a;
    --pop3: #00cecb;
    --pop4: #ff6b9d;
    --pop5: #c77dff;
    --shadow-lg: 8px 8px 0px var(--ink);
  }

  html, body { width: 1200px; height: 630px; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* noise texture */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.4;
  }

  /* corner accent bars */
  .bar { position: absolute; height: 14px; }
  .bar-top { top: 0; left: 0; right: 0; background: linear-gradient(90deg,
      var(--pop1) 0 20%, var(--pop2) 20% 40%, var(--pop3) 40% 60%,
      var(--pop4) 60% 80%, var(--pop5) 80% 100%); }
  .bar-bottom { bottom: 0; left: 0; right: 0; background: linear-gradient(90deg,
      var(--pop5) 0 20%, var(--pop4) 20% 40%, var(--pop3) 40% 60%,
      var(--pop2) 60% 80%, var(--pop1) 80% 100%); }

  /* floating doodles */
  .doodle { position: absolute; opacity: 0.12; font-size: 5rem; }
  .d1 { top: 70px; left: 90px; transform: rotate(-12deg); }
  .d2 { top: 90px; right: 110px; transform: rotate(10deg); }
  .d3 { bottom: 90px; left: 130px; transform: rotate(8deg); }
  .d4 { bottom: 80px; right: 100px; transform: rotate(-10deg); }

  .badge {
    display: inline-block;
    background: var(--pop2);
    color: var(--ink);
    font-family: 'Boogaloo', cursive;
    font-size: 1.5rem;
    letter-spacing: 3px;
    padding: 0.5rem 1.6rem;
    border-radius: 50px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 2.2rem;
    text-transform: uppercase;
    position: relative;
  }

  .logo {
    font-family: 'Boogaloo', cursive;
    font-size: 9rem;
    line-height: 0.9;
    letter-spacing: 4px;
    position: relative;
    margin-bottom: 0.6rem;
  }
  .logo .dot {
    display: inline-block;
    width: 28px; height: 28px;
    background: var(--pop1);
    border: 4px solid var(--ink);
    border-radius: 50%;
    vertical-align: middle;
    margin-left: 8px;
  }

  .tagline {
    font-family: 'Boogaloo', cursive;
    font-size: 3rem;
    color: var(--pop1);
    -webkit-text-stroke: 2px var(--ink);
    letter-spacing: 1px;
    margin-bottom: 2.4rem;
    position: relative;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-family: 'Boogaloo', cursive;
    font-size: 2rem;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--pop3);
    padding: 0.9rem 2.4rem;
    border-radius: 50px;
    border: 4px solid var(--ink);
    box-shadow: var(--shadow-lg);
    position: relative;
  }

  .url {
    position: absolute;
    bottom: 42px;
    font-family: 'Boogaloo', cursive;
    font-size: 1.5rem;
    letter-spacing: 2px;
    color: #b0ada4;
  }
</style>
</head>
<body>
  <div class="bar bar-top"></div>
  <div class="bar bar-bottom"></div>

  <div class="doodle d1">⭐</div>
  <div class="doodle d2">🎈</div>
  <div class="doodle d3">🦄</div>
  <div class="doodle d4">✨</div>

  <div class="badge">✨ made with silly love ✨</div>
  <div class="logo">obfy<span class="dot"></span></div>
  <div class="tagline">little things that spark joy</div>
  <div class="pill"><span>🎹</span> Try Toddler Mode</div>

  <div class="url">obfy.xyz</div>
</body>
</html>
