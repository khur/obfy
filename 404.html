<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — this page wandered off 🫠</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffdf7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1c1c2e;
    --cream: #fffdf7;
    --pop1: #ff5e5b;
    --pop2: #ffed4a;
    --pop3: #00cecb;
    --shadow-lg: 6px 6px 0px var(--ink);
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    overflow: hidden;
  }

  .emoji {
    font-size: clamp(4rem, 18vw, 9rem);
    display: block;
    margin-bottom: 1rem;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-14px) rotate(4deg); }
  }

  .code {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(5rem, 22vw, 11rem);
    line-height: 0.9;
    color: var(--pop1);
    -webkit-text-stroke: 2px var(--ink);
    letter-spacing: 2px;
  }

  .title {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    margin: 0.5rem 0 1rem;
  }

  .sub {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    font-weight: 500;
    color: #555;
    max-width: 460px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'Boogaloo', cursive;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--pop3);
    padding: 0.9rem 2.2rem;
    border-radius: 50px;
    border: 3px solid var(--ink);
    box-shadow: var(--shadow-lg);
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .cta:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0px var(--ink);
  }
  .cta:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--ink);
  }

  @media (prefers-reduced-motion: reduce) {
    .emoji { animation: none; }
    .cta { transition: none; }
  }
</style>
</head>
<body>
  <span class="emoji">🫠</span>
  <div class="code">404</div>
  <h1 class="title">This page wandered off</h1>
  <p class="sub">
    Maybe a toddler got to the keyboard. Either way, there's nothing here —
    but there's plenty of joy back home.
  </p>
  <a href="/" class="cta">🎉 Take me home</a>
</body>
</html>
